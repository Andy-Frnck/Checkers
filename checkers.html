<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkers</title>
    <link rel="stylesheet" href="styles/checkers.css" />
    <link rel="stylesheet" href="styles/header.css" />
    <link
      href="https://fonts.googleapis.com/css?family=Oxygen:300,regular,700"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/general.css">
  </head>
  <body>
    <div class="header">
      <div class="description">
        <img class="logo" src="thumbnails/imgcheckers.jpg" alt="logo website" />
        <p class="title">Checkers</p>
      </div>
      <div class="links-interactive">
        <div class="settings">
          <img class="settings-icon" src="thumbnails/icons/cpum.svg" alt="" />
          <p class="option">play with computer</p>
        </div>
        <div class="settings">
          <img class="settings-icon" src="thumbnails/icons/usersm.svg" alt="" />
          <p class="option">play with friend</p>
        </div>
        <div class="settings">
          <img
            class="settings-icon"
            src="thumbnails/icons/questionm.svg"
            alt=""
          />
          <p class="option">Need help ?</p>
        </div>
      </div>
    </div>
    <div class="board"></div>
    <script type="module" src="scripts/checkers.js"></script>
  </body>
</html>
